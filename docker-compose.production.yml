services:
  icarus:
    image: ${ICARUS_IMAGE:?Set ICARUS_IMAGE to a published immutable image reference}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      APP_BOOTSTRAP_DEMO_DATA: "false"
      APP_DATABASE_URL: ${APP_DATABASE_URL:?Supply the managed PostgreSQL URL from the secret manager}
      APP_STORAGE_BACKEND: s3
      APP_UPLOAD_DIR: /tmp/icarus-uploads
      APP_MAX_UPLOAD_BYTES: ${APP_MAX_UPLOAD_BYTES:-5242880}
      APP_MAX_PDF_PAGES: ${APP_MAX_PDF_PAGES:-25}
      APP_S3_BUCKET: ${APP_S3_BUCKET:?Set the private S3 bucket}
      APP_S3_REGION: ${APP_S3_REGION:?Set the S3 region}
      APP_S3_ENDPOINT_URL: ${APP_S3_ENDPOINT_URL:-}
      APP_S3_PREFIX: ${APP_S3_PREFIX:-icarus}
      APP_S3_ENCRYPTION: aws:kms
      APP_S3_KMS_KEY_ID: ${APP_S3_KMS_KEY_ID:?Set the KMS key ID}
      APP_AUTH_MODE: oidc
      APP_OIDC_ISSUER: ${APP_OIDC_ISSUER:?Set the approved HTTPS OIDC issuer}
      APP_OIDC_CLIENT_ID: ${APP_OIDC_CLIENT_ID:?Set the OIDC client ID}
      APP_OIDC_CLIENT_SECRET: ${APP_OIDC_CLIENT_SECRET:?Supply the OIDC client secret from the secret manager}
      APP_OIDC_ALLOWED_DOMAINS: ${APP_OIDC_ALLOWED_DOMAINS:?Set approved identity domains}
      APP_SESSION_COOKIE_SECRET: ${APP_SESSION_COOKIE_SECRET:?Supply a unique 32+ character secret from the secret manager}
      APP_MALWARE_SCAN_MODE: clamav
      APP_CLAMAV_HOST: ${APP_CLAMAV_HOST:?Set the private ClamAV service hostname}
      APP_CLAMAV_PORT: ${APP_CLAMAV_PORT:-3310}
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:?Set the public Icarus hostname}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:?Set the public HTTPS browser origin}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health/ready',headers={'Host':os.environ['APP_ALLOWED_HOSTS'].split(',')[0]}); urllib.request.urlopen(r, timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
