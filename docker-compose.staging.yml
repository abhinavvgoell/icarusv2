services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arbiter
      POSTGRES_USER: arbiter
      POSTGRES_PASSWORD: arbiter-staging-only
    volumes:
      - arbiter-staging-postgres:/var/lib/postgresql/data
      - ./infra/postgres/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./infra/postgres/002_shared_login_throttling.sql:/docker-entrypoint-initdb.d/002_shared_login_throttling.sql:ro
      - ./infra/postgres/003_ai_document_assistance.sql:/docker-entrypoint-initdb.d/003_ai_document_assistance.sql:ro
      - ./infra/postgres/004_extracted_field_quote.sql:/docker-entrypoint-initdb.d/004_extracted_field_quote.sql:ro
      - ./infra/postgres/005_reviewer_assignment_escalation.sql:/docker-entrypoint-initdb.d/005_reviewer_assignment_escalation.sql:ro
      - ./infra/postgres/006_rule_pack_versions.sql:/docker-entrypoint-initdb.d/006_rule_pack_versions.sql:ro
      - ./infra/postgres/007_facility_reviews.sql:/docker-entrypoint-initdb.d/007_facility_reviews.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbiter -d arbiter"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    volumes:
      - arbiter-staging-clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "[ \"$(echo PING | nc localhost 3310)\" = PONG ]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 2m
    restart: unless-stopped

  arbiter:
    build: .
    ports:
      - "127.0.0.1:${APP_STAGING_PORT:-8002}:8000"
    environment:
      APP_ENV: development
      APP_AUTH_MODE: local
      APP_SESSION_COOKIE_SECRET: staging-only-session-secret-not-for-production-000000000000
      APP_DATABASE_URL: postgresql://arbiter:arbiter-staging-only@postgres:5432/arbiter
      APP_BOOTSTRAP_DEMO_DATA: "true"
      APP_UPLOAD_DIR: /var/lib/arbiter/uploads
      APP_AI_MODEL_DIR: /var/lib/arbiter/models/arbiter-ai
      APP_STORAGE_BACKEND: local
      APP_MALWARE_SCAN_MODE: clamav
      APP_CLAMAV_HOST: clamav
      APP_CLAMAV_PORT: "3310"
      APP_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      APP_ALLOWED_ORIGINS: http://localhost:${APP_STAGING_PORT:-8002},http://127.0.0.1:${APP_STAGING_PORT:-8002}
    volumes:
      - arbiter-staging-uploads:/var/lib/arbiter/uploads
      - ./data/models/arbiter-ai:/var/lib/arbiter/models/arbiter-ai:ro
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  arbiter-staging-postgres:
  arbiter-staging-clamav:
  arbiter-staging-uploads:
